# Rime settings
# encoding: utf-8
# by: 空山明月
# date: 2024-05-27

config_version: '2.1'

schema_list:
  - {schema: wubi}
  - {schema: wubi_pinyin}
  - {schema: luna_pinyin_simp}
  - {schema: wb_spelling}

switcher:
  caption: 〈菜单项〉
  hotkeys:
    - "Control+F8"
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __include: key_bindings:/

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    # uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

menu:
  page_size: 10
  alternative_select_labels: [1, 2, 3, 4, 5, 6, 7, 8, 9, 0]
